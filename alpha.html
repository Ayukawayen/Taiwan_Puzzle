<title>台灣拼圖合成 v7</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 版面：直式容器置中，左側為儀表欄（寬螢幕）；窄螢幕時儀表欄收成上方一列。 */
:root {
  --paper: #e8edec;        /* 頁面底色：偏青的灰 */
  --panel: #f6f8f7;
  --ink: #1d2b30;
  --ink-soft: #55676d;
  --rule: #c5d0d1;
  --accent: #1f5f7a;       /* 深海藍 */
  --accent-ink: #ffffff;
  --danger: #c9402a;
  --good: #3b7d4f;
  --water: #d4e6ec;
  --water-deep: #bcd6df;
  --dropzone: #e3eff2;
  --wall: #5e7882;
  /* 畫布配色全部取自 ColorBrewer：填色 Set2；水面 Blues；文字／邊界／牆 Greys；警示 Reds；導引線 Greens；提示 Set1 */
  --cat-county: #66c2a5;   /* 縣   Set2 */
  --cat-metro: #fc8d62;    /* 直轄市 Set2 */
  --cat-city: #8da0cb;     /* 市   Set2 */
  --cv-text: #000000;      /* Greys 最深 */
  --edge-out: #252525;     /* 外部境界線 Greys */
  --edge-in: #ffffff;      /* 內部（已合併）境界線，虛線 Greys */
  --cv-drop: #f7fbff;      /* Blues */
  --cv-water: #deebf7;
  --cv-water-deep: #c6dbef;
  --cv-wall: #737373;
  --cv-danger: #de2d26;    /* Reds */
  --guide: #238b45;        /* Greens */
  --guide-text: #000000;
  --hint: #377eb8;         /* Set1 */
  --ghost: #636363;        /* 落點預覽的斜線與虛線外框：Greys */
  --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11191c; --panel: #192327; --ink: #e3ecee; --ink-soft: #92a6ac; --rule: #2b3b41;
    --accent: #6ab6d4; --accent-ink: #0b1a20; --danger: #ff7a62; --good: #7bc58f;
    --water: #16262d; --water-deep: #102026; --dropzone: #131f25; --wall: #6b8893;
    --cv-text: #000000; --edge-out: #f0f0f0; --edge-in: #252525; --cv-drop: #252525; --cv-water: #000000; --cv-water-deep: #000000;
    --cv-wall: #969696; --cv-danger: #fb6a4a; --guide: #74c476; --guide-text: #ffffff; --hint: #ffff33; --ghost: #d9d9d9;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11191c; --panel: #192327; --ink: #e3ecee; --ink-soft: #92a6ac; --rule: #2b3b41;
  --accent: #6ab6d4; --accent-ink: #0b1a20; --danger: #ff7a62; --good: #7bc58f;
  --water: #16262d; --water-deep: #102026; --dropzone: #131f25; --wall: #6b8893;
  --cv-text: #000000; --edge-out: #f0f0f0; --edge-in: #252525; --cv-drop: #252525; --cv-water: #000000; --cv-water-deep: #000000;
  --cv-wall: #969696; --cv-danger: #fb6a4a; --guide: #74c476; --guide-text: #ffffff; --hint: #ffff33; --ghost: #d9d9d9;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 14px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 10px; box-sizing: border-box; overflow: hidden; overscroll-behavior: none;
}
#app { height: 100%; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
header.top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .04em; text-wrap: balance; }
.tag { font-size: 12px; color: var(--ink-soft); }
.spacer { flex: 1; }
.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 12px; }
.hud { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; padding-right: 2px; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.card h2 { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: .08em; color: var(--ink-soft); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat span { font-size: 11px; color: var(--ink-soft); }
.stat b { font-family: var(--font-num); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.next { display: flex; align-items: center; gap: 10px; }
#next { width: 84px; height: 84px; flex: none; border-radius: 6px; background: var(--dropzone); border: 1px solid var(--rule); }
#nextName { font-size: 15px; font-weight: 500; }
.bar { height: 10px; border-radius: 5px; background: var(--water-deep); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 100%; background: var(--good); border-radius: 5px; transition: background .15s; }
.bar.low > i { background: var(--danger); }
button, .btn {
  font: inherit; font-weight: 500; color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
  border-radius: 6px; padding: 8px 12px; cursor: pointer; min-height: 38px; touch-action: manipulation;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--danger); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > button { flex: 1 1 auto; }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
#msg { min-height: 2.6em; font-size: 13px; color: var(--ink-soft); line-height: 1.45; }
.keys { font-size: 12px; color: var(--ink-soft); line-height: 1.6; }
kbd { font-family: var(--font-num); font-size: 11px; border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; background: var(--panel); }

.board { position: relative; min-width: 0; min-height: 0; }
canvas#game { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; border-radius: 8px; cursor: crosshair; }
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--paper) 72%, transparent); border-radius: 8px; padding: 16px; z-index: 5; }
.overlay[hidden] { display: none !important; }
.dialog { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 18px 20px; max-width: 360px; width: 100%; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.18); max-height: 100%; overflow-y: auto; }
.dialog > * { flex-shrink: 0; }
.dialog > .row:last-child { position: sticky; bottom: -18px; background: var(--panel); padding: 8px 0 2px; }
.dialog h3 { margin: 0; font-size: 17px; text-wrap: balance; }
.dialog p.note { font-size: 12px; }
.dialog p { margin: 0; color: var(--ink-soft); line-height: 1.55; }
.dialog.wide { max-width: 640px; }
.resbody { display: flex; gap: 14px; align-items: flex-start; min-height: 0; }
.resbody .legend { flex: 1; min-width: 0; }
#resMap { flex: none; height: min(56vh, 520px); width: auto; max-width: 48%; object-fit: contain; border-radius: 6px; background: var(--cv-drop); border: 1px solid var(--rule); }
.legend { font-size: 12px; line-height: 1.6; color: var(--ink-soft); }
.legend b { color: var(--ink); font-weight: 500; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: baseline; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.shk { white-space: pre; text-align: center; }
label.mode { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-soft); }
label.mode select { font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 5px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); flex: 1; }
#slotCv { width: 84px; height: 84px; flex: none; border-radius: 6px; background: var(--dropzone); border: 1px dashed var(--rule); }
#slotName { font-size: 15px; font-weight: 500; }
.fields { display: grid; grid-template-columns: 1fr 96px; gap: 8px 10px; align-items: center; font-size: 13px; }
.fields input[type=number] { font: inherit; font-family: var(--font-num); width: 100%; box-sizing: border-box; padding: 5px 6px; border-radius: 5px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.fields select { font: inherit; width: 100%; box-sizing: border-box; padding: 5px 6px; border-radius: 5px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.fields .full { grid-column: 1 / -1; }

@media (max-width: 760px) {
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
  .hud { flex-direction: row; flex-wrap: nowrap; overflow: visible; align-items: stretch; gap: 6px; }
  .hud .card { padding: 6px 8px; flex: 1 1 0; min-width: 0; gap: 6px; }
  .hud .card h2 { display: none; }
  .hud .card.hide-narrow, .keys { display: none; }
  .stats { grid-template-columns: 1fr; gap: 1px; }
  .stat { flex-direction: row; justify-content: space-between; align-items: baseline; }
  .stat b { font-size: 14px; }
  .next { flex-direction: column; gap: 4px; }
  #next { width: 56px; height: 56px; }
  #nextName { font-size: 12px; }
  .hud .row > button { min-height: 34px; padding: 4px 4px; font-size: 13px; }
  .hud .row .k { display: none; }
  label.mode { flex-direction: column; align-items: stretch; gap: 2px; font-size: 11px; }
  label.mode select { font-size: 12px; padding: 2px 2px; min-width: 0; width: 100%; }
  #slotCv { width: 56px; height: 56px; }
  #slotName { font-size: 12px; }
  .resbody { flex-direction: column; align-items: stretch; }
  #resMap { align-self: center; max-width: 100%; height: min(44vh, 360px); }
  header.top .tag { display: none; }
  #msg { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

<div id="app">
  <header class="top">
    <h1>台灣拼圖合成</h1>
    <span class="tag">物理原型 v7 · 本島 19 塊 + 澎湖</span>
    <span class="spacer"></span>
    <button id="btnSettings" type="button">調參</button>
    <button id="btnEnd" type="button" class="danger">結束</button>
  </header>
  <main class="stage">
    <aside class="hud" id="hud">
      <section class="card">
        <h2>進度</h2>
        <div class="stats">
          <div class="stat"><span>已放下</span><b id="sDropped">0/19</b></div>
          <div class="stat"><span>區塊</span><b id="sGroups">0</b></div>
          <div class="stat"><span>時間</span><b id="sTime">0:00</b></div>
        </div>
      </section>
      <section class="card">
        <h2>下一塊</h2>
        <div class="next"><canvas id="next" width="168" height="168" aria-label="下一塊拼圖"></canvas><div id="nextName">—</div></div>
      </section>
      <section class="card">
        <h2>保留區（1 格）</h2>
        <div class="next"><canvas id="slotCv" width="168" height="168" aria-label="保留區"></canvas><div><div id="slotName">空</div></div></div>
        <div class="row"><button id="btnHold" type="button"><span id="holdLabel">保留</span><span class="k">（H）</span></button></div>
      </section>
      <section class="card">
        <h2>拍打機台</h2>
        <div class="bar" id="stamBar" role="progressbar" aria-label="體力" aria-valuemin="0" aria-valuemax="100"><i id="stam"></i></div>
        <div class="row" id="shakeSel"><button id="btnShakeL" type="button" class="primary shk">◀ 左拍<span class="k">（Z）</span>　</button><button id="btnShakeR" type="button" class="primary shk">　右拍<span class="k">（X）</span> ▶</button></div>
        <div class="row" id="shakeAlt" hidden><button id="btnShakeA" type="button" class="primary shk"><span id="altL"></span>拍打<span class="k">（S）</span><span id="altR"></span></button></div>
        <label class="mode">模式 <select id="selMode"><option value="0">自選左右</option><option value="1">左右交替</option></select></label>
      </section>
      <section class="card">
        <label class="mode">地圖 <select id="selMap"><option value="1">本島 19 塊</option><option value="2">含澎湖 20 塊</option></select></label>
        <label class="mode" title="A：澎湖連上一個區塊後，不再因澎湖的接觸而合併。B：連上後，澎湖碰到其他西部海岸縣市還會再合併。">澎湖規則 <select id="selLink"><option value="A">A 只連一次</option><option value="B">B 可再合併</option></select></label>
      </section>
      <section class="card hide-narrow">
        <label class="chk"><input type="checkbox" id="chkHint"> 鄰接提示（高亮可合併的縣市）</label>
        <div id="msg" aria-live="polite"></div>
      </section>
      <section class="card hide-narrow keys">
        <div><kbd>←</kbd><kbd>→</kbd> 或滑鼠／手指拖曳：移動</div>
        <div><kbd>空白</kbd> 或點一下：放下</div>
        <div>手機：手指拖到紅色淘汰線以上再放開＝取消</div>
        <div>拼圖會自己順時針轉，點下去時的角度就是落下的角度；虛線處是第一次碰到東西的位置</div>
        <div><kbd>H</kbd> 保留／取出　<kbd>Z</kbd><kbd>X</kbd> 左拍／右拍　<kbd>S</kbd> 交替模式拍打</div>
      </section>
    </aside>
    <section class="board" id="board">
      <canvas id="game" aria-label="遊戲畫面"></canvas>
      <div class="overlay" id="ovConfirm" hidden>
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="cfTitle">
          <h3 id="cfTitle"></h3>
          <p id="cfBody"></p>
          <div class="row"><button id="cfNo" type="button">取消</button><button id="cfYes" type="button" class="primary">確定</button></div>
        </div>
      </div>
      <div class="overlay" id="ovEnd" hidden>
        <div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="endTitle">
          <h3 id="endTitle"></h3>
          <p id="endBody"></p>
          <div class="resbody"><canvas id="resMap" width="360" height="760" aria-label="目前盤面的區塊地圖"></canvas><div id="endLegend" class="legend"></div></div>
          <div class="row"><button id="endClose" type="button">隱藏視窗</button><button id="endAgain" type="button" class="primary">開啟新局</button></div>
        </div>
      </div>
      <div class="overlay" id="ovSettings" hidden>
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="stTitle">
          <h3 id="stTitle">設定</h3>
          <div class="fields"><label for="selTheme">外觀（立即生效）</label><select id="selTheme"><option value="system">系統</option><option value="light">淺色</option><option value="dark">深色</option></select></div>
          <p class="note">以下參數按「套用並重來」後生效，並會重新開始一局。</p>
          <div class="fields" id="fields"></div>
          <div class="row"><button id="stCancel" type="button">關閉</button><button id="stReset" type="button">還原預設</button><button id="stApply" type="button" class="primary">套用並重來</button></div>
        </div>
      </div>
    </section>
  </main>
</div>

      const nm = (g) => g.members.map((m) => pieces[m].name).join("+");
      for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
        let w = 0;
        for (const A of all[i]) for (const B of all[j]) {
          if (A.b[2] < B.b[0] || A.b[0] > B.b[2] || A.b[3] < B.b[1] || A.b[1] > B.b[3]) continue;
          w = Math.max(w, -satGap(A.pts, B.pts, 0, 0));
        }
        if (w > minPx) out.push([nm(gl[i]), nm(gl[j]), +w.toFixed(1)]);
      }
      for (let i = 0; i < all.length; i++) { let w = 0; for (const A of all[i]) w = Math.max(w, A.b[3] - floorY(), -A.b[0], A.b[2] - P.containerW); if (w > minPx) out.push([nm(gl[i]), "牆/地板", +w.toFixed(1)]); }
      return out;
    }

    function hull2(pts) {   // 凸包（Andrew monotone chain）
      pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
      const lo = [];
      for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
      const up = [];
      for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
      up.pop(); lo.pop();
      return lo.concat(up);
    }
    function minkDiff(P_, Q_) {   // P − Q 的凸包
      const pts = [];
      for (const p of P_) for (const q of Q_) pts.push([p[0] - q[0], p[1] - q[1]]);
      return hull2(pts);
    }
    function chordAtX(H, x) {     // 凸多邊形 H 與直線 X=x 相交的 [yMin, yMax]；沒有則 null
      let lo = Infinity, hi = -Infinity;
      for (let i = 0, n = H.length; i < n; i++) {
        const p = H[i], q = H[(i + 1) % n];
        if ((p[0] <= x && q[0] >= x) || (p[0] >= x && q[0] <= x)) {
          if (p[0] === q[0]) { lo = Math.min(lo, p[1], q[1]); hi = Math.max(hi, p[1], q[1]); }
          else { const y = p[1] + (q[1] - p[1]) * (x - p[0]) / (q[0] - p[0]); if (y < lo) lo = y; if (y > hi) hi = y; }
        }
      }
      return lo === Infinity ? null : [lo, hi];
    }

    // ---------------------------------------------------------- 落點預覽
    // 手上拼圖以目前角度、目前 x 直直落下，回傳「第一次碰到地板／任何拼圖」時的 home 姿態。
    function dropPreview() {
      const hp = heldPose(); if (!hp) return null;
      const c = Math.cos(hp.a), sn = Math.sin(hp.a);
      const mine = pieces[hp.county].physics.convex.map((cv) => cv.map(([x, y]) => [hp.x + x * c - y * sn, hp.y + x * sn + y * c]));
      const boxes = mine.map((A) => { let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; for (const p of A) { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; } return [x0, y0, x1, y1]; });
      let best = floorY() - Math.max(...boxes.map((b) => b[3])) - 1;       // 地板
      let hitBy = -1;
      for (const g of groups.values()) {
        for (const B of bodyPolys(g.body)) {
          for (let k = 0; k < mine.length; k++) {
            const ab = boxes[k];
            if (B.b[2] < ab[0] || B.b[0] > ab[2] || B.b[3] < ab[1]) continue;
            const D = minkDiff(B.pts, mine[k]);
            const ch = chordAtX(D, 0);
            if (!ch || ch[1] < 0) continue;
            const t = Math.max(ch[0], 0) - 1;
            if (t < best) { best = t; hitBy = g.id; }
          }
        }
      }
      best = Math.max(best, 0);
      return { county: hp.county, x: hp.x, y: hp.y + best, a: hp.a, dy: best, hitBy };
    }

    // ---------------------------------------------------------- 接觸上下關係
    // 從一個接觸記錄縣市 a（fixture A）與 b（fixture B）的上下：法向量由 A 指向 B，y 向下，ny > 0 表示 A 在上
    function recordRel(c, a, b, now) {
      const man = c.getManifold(); if (!man || !man.pointCount) return;
      wmBuf = c.getWorldManifold(wmBuf);
      const ny = wmBuf.normal.y, k = a * N + b, k2 = b * N + a;
      if (relT[k] !== now) { relS[k] = 0; relS[k2] = 0; relT[k] = now; relT[k2] = now; }   // 每一步重新累計（只反映最新的接觸）
      if (Math.abs(ny) >= P.relMinNy) { const v = (ny > 0 ? 1 : -1) * man.pointCount; relS[k] += v; relS[k2] -= v; }
    }
    // 測試用：兩個區塊目前的實際上下（> 0：gx 在 gy 上方；以水平重疊的凸塊對投票）
    function verticalOrder(gx, gy) {
      let v = 0;
      const PA = bodyPolys(gx.body), PB = bodyPolys(gy.body);
      for (const A of PA) for (const B of PB) {
        if (Math.min(A.b[2], B.b[2]) - Math.max(A.b[0], B.b[0]) <= 1) continue;
        const ch = chordAtX(minkDiff(A.pts, B.pts), 0); if (!ch) continue;
        if (ch[1] <= 0.5) v++; else if (ch[0] >= -0.5) v--;
      }
      return v;
    }
    // 兩個區塊的關係：> 0 gx 在 gy 上方；< 0 在下方；0 沒有有效資料（或只有並排接觸）；NaN 上下混雜
    function groupRel(gx, gy, skip) {
      if (!gx || !gy) return 0;
      const now = simSteps * P.dt; let pos = 0, neg = 0;
      for (const a of gx.members) {
        if (skip && skip.has(a)) continue;
        for (const b of gy.members) {
          if (skip && skip.has(b)) continue;
          const k = a * N + b; if (now - relT[k] > P.relTTL) continue;
          const v = relS[k]; if (v > 0) pos += v; else neg -= v;
        }
      }
      if (!pos && !neg) return 0;
      if (Math.min(pos, neg) >= P.relMixed * Math.max(pos, neg)) return NaN;
      return pos - neg;
    }

    // ---------------------------------------------------------- 合併後的垂直上推
    // 新區塊 ng 只能「垂直上升」。要升多少，由它下方／重疊的障礙（含地板）決定；
    // 上升路徑上被掃到、或壓在它上面的區塊會被一起推高（含連鎖：壓在被推區塊上的也一起走）。
    // 作法：算出每一對區塊的垂直關係（誰在上、至少要拉開多少），再用最長路徑傳遞「被推高多少」。
    function liftAfterMerge(ng, skip) {
      const DELTA = 1, TOL = 1;
      const gl = [...groups.values()];
      const gById = new Map(gl.map((g) => [g.id, g]));
      const polys = new Map(gl.map((g) => [g.id, bodyPolys(g.body)]));
      const xr = new Map(gl.map((g) => { let a = 1e9, b = -1e9; for (const p of polys.get(g.id)) { if (p.b[0] < a) a = p.b[0]; if (p.b[2] > b) b = p.b[2]; } return [g.id, [a, b]]; }));
      // 規劃（不動剛體）：useRel＝是否採用接觸上下關係。採用時若關係互相矛盾成環，改用純幾何重新規劃
      const plan = (useRel) => {
        const tally = { forced: 0, geo: 0, capped: 0, mixed: 0 };
        const pairCache = new Map();
        // 回傳 {lower, upper, req}：d[upper] ≥ d[lower] + req；沒有垂直重疊關係則 null
        function pairReq(ia, ib) {
          const key = ia < ib ? ia * 4096 + ib : ib * 4096 + ia;
          if (pairCache.has(key)) return pairCache.get(key);
          let out = null;
          const xa = xr.get(ia), xb = xr.get(ib);
          if (xa[1] - xb[0] > DELTA && xb[1] - xa[0] > DELTA) {
            let bestUp = null;     // 以 ia 為下、ib 為上：ib 至少要比 ia 多升多少
            let bestDn = null;     // 以 ib 為下、ia 為上
            for (const A of polys.get(ia)) for (const B of polys.get(ib)) {
              if (A.b[2] - B.b[0] <= DELTA || B.b[2] - A.b[0] <= DELTA) continue;
              const D = minkDiff(A.pts, B.pts);
              const c0 = chordAtX(D, 0); if (!c0) continue;
              if (!chordAtX(D, DELTA) || !chordAtX(D, -DELTA)) continue;
              const rUp = -c0[0] - TOL, rDn = c0[1] - TOL;
              if (bestUp == null || rUp > bestUp) bestUp = rUp;
              if (bestDn == null || rDn > bestDn) bestDn = rDn;
            }
            // 上下關係以「整個區塊」一起決定（每一對凸塊各自決定會造成互相矛盾、留下重疊）
            //   1. 最近仍有效的接觸上下關係（雙方成員的接觸線彙總）
            //   2. 沒有資料、上下混雜、或依接觸關係所需的上推比另一方向多出 relCapPx 以上 → 幾何：取所需位移較小的方向
            if (bestUp != null) {
              const mine = ia === ng.id || ib === ng.id;
              let lowerIsA = bestUp <= bestDn, how = "geo";
              if (useRel) {
                const r = groupRel(gById.get(ia), gById.get(ib), skip);
                if (Number.isNaN(r)) how = "mixed";
                else if (r !== 0) {
                  const wantLowerA = r < 0;                       // r < 0：ia 在 ib 下方
                  const reqWant = wantLowerA ? bestUp : bestDn, reqOther = wantLowerA ? bestDn : bestUp;
                  if (mine && reqWant > reqOther + P.relCapPx) how = "capped";
                  else { lowerIsA = wantLowerA; how = "forced"; }
                }
              }
              tally[how]++;
              if (lowerIsA) out = { lower: ia, upper: ib, req: mine ? bestUp : Math.min(bestUp, 0), how };
              else out = { lower: ib, upper: ia, req: mine ? bestDn : Math.min(bestDn, 0), how };
            }
          }
          pairCache.set(key, out);
          return out;
        }
        const d = new Map(gl.map((g) => [g.id, 0]));
        // 新區塊自身的下限：地板、以及它下方的障礙
        const bb = groupAABB(ng);
        let dM = Math.max(0, bb[3] - (floorY() - 0.5));
        for (const g of gl) if (g !== ng) { const r = pairReq(ng.id, g.id); if (r && r.upper === ng.id) dM = Math.max(dM, r.req); }
        d.set(ng.id, dM);
        if (P.debugLift) {
          const nmg = (g) => g.members.map((m) => pieces[m].name).join("+");
          for (let x = 0; x < gl.length; x++) for (let y = x + 1; y < gl.length; y++) { const r = pairReq(gl[x].id, gl[y].id); if (r) console.log("   [lift]", nmg(gl[r.lower === gl[x].id ? x : y]), "→(下→上)", nmg(gl[r.lower === gl[x].id ? y : x]), "req", +r.req.toFixed(1)); }
        }
        // 最長路徑傳遞（glue：「口袋」關係的兩個區塊強制同升，見下方驗證）
        const glue = new Map();   // gid → Set(gid)
        let cyc = false;
        const propagate = () => {
          for (const g of gl) d.set(g.id, 0);
          d.set(ng.id, dM);
          const queue = [ng.id]; let pops = 0;
          while (queue.length) {
            const i = queue.shift();
            if (++pops > 900) { cyc = true; break; }
            for (const g of gl) {
              if (g.id === i) continue;
              const r = pairReq(i, g.id);
              if (r && r.lower === i) {
                const v = d.get(i) + r.req;
                if (v > d.get(r.upper) + 1e-6) { d.set(r.upper, v); if (!queue.includes(r.upper)) queue.push(r.upper); }
              }
              if (glue.has(i) && glue.get(i).has(g.id) && d.get(i) > d.get(g.id) + 1e-6) { d.set(g.id, d.get(i)); if (!queue.includes(g.id)) queue.push(g.id); }
            }
          }
        };
        propagate();
        const cycBase = cyc;
        // 驗證：套用後仍互相穿透的一對（小塊卡在大塊的「口袋」裡：大塊上方與下方各有一部分，單純上推會讓下半部頂進小塊）
        // → 把這一對綁在一起同升，重算；最多 6 輪
        const unfixable = new Set();
        for (let round = 0; round < 6; round++) {
          const added = [];
          for (let a = 0; a < gl.length; a++) for (let b = a + 1; b < gl.length; b++) {
            const ia = gl[a].id, ib = gl[b].id, key = ia * 4096 + ib;
            if (unfixable.has(key)) continue;
            const xa = xr.get(ia), xb = xr.get(ib);
            if (!(xa[1] - xb[0] > DELTA && xb[1] - xa[0] > DELTA)) continue;
            const dy = -d.get(ia) + d.get(ib);   // A 相對 B 的垂直位移（y 向下，上升為負）
            let w = 0;
            for (const A of polys.get(ia)) for (const B of polys.get(ib)) {
              if (A.b[2] <= B.b[0] || A.b[0] >= B.b[2]) continue;
              w = Math.max(w, -satGap(A.pts, B.pts, 0, dy));
            }
            if (w > 3) {
              if (!glue.has(ia)) glue.set(ia, new Set()); if (!glue.has(ib)) glue.set(ib, new Set());
              glue.get(ia).add(ib); glue.get(ib).add(ia); added.push([ia, ib, key]);
            }
          }
          if (!added.length) break;
          cyc = false; propagate();
          let maxd = 0; for (const v of d.values()) maxd = Math.max(maxd, v);
          if (cyc || maxd > floorY()) {   // 綁在一起會讓高度無限推高（上下夾住、垂直上推無解）→ 撤回，維持原本的結果
            for (const [ia, ib, key] of added) { glue.get(ia).delete(ib); glue.get(ib).delete(ia); unfixable.add(key); }
            cyc = false; propagate();
          }
        }
        if (cyc) { for (const g of gl) d.set(g.id, 0); d.set(ng.id, dM); }   // 關係矛盾（循環）：只推新區塊，其餘交給物理引擎
        if (P.debugLiftWarn && (dM > 600 || cyc)) console.error("[lift警告] cycBase", cycBase, "dM", dM.toFixed(0), "cyc", cyc, "glue", [...glue.entries()].map(([k, v]) => k + ":" + [...v]).join(" "), "unfixable", unfixable.size, "max d", Math.max(...d.values()).toFixed(0));
        return { d, cyc, dM, tally };
      };
      let R = plan(!!P.liftByContact), retried = false;
      if (R.cyc && P.liftByContact) { R = plan(false); retried = true; }
      const { d, cyc, tally } = R;
      for (const k in tally) relStats[k] += tally[k];
      if (retried) relStats.retried = (relStats.retried || 0) + 1;
      // 套用
      const carried = [];
      const fromPoses = new Map();
      for (const g of gl) {
        const dy = d.get(g.id);
        if (!(dy > 0.05)) continue;
        if (g !== ng) { carried.push(g.id); for (const m of g.members) { const p = worldPointOfMember(g, m); fromPoses.set(m, { x: p[0], y: p[1], a: g.body.getAngle() }); } }
        const p = g.body.getPosition();
        g.body.setTransform(Vec2(p.x, p.y - dy * S), g.body.getAngle());
        g.body.setAwake(true);
        if (dy > 2) g.landed = false;
      }
      for (const [m, fp] of fromPoses) tweens[m] = { x: fp.x, y: fp.y, a: fp.a, t: 0 };
      return { lift: d.get(ng.id), carried, cycle: cyc, maxd: Math.max(...d.values()), rel: tally, retried };
    }

    // ---------------------------------------------------------- 合併
    function mergeGroups(gA, gB, cA, cB) {
      const bA = gA.body, bB = gB.body;
      const mA = bA.getMass(), mB = bB.getMass(), M = mA + mB;
      const comA = bA.getWorldCenter(), comB = bB.getWorldCenter();
      const com = Vec2((comA.x * mA + comB.x * mB) / M, (comA.y * mA + comB.y * mB) / M);
      const vA = bA.getLinearVelocity(), vB = bB.getLinearVelocity();
      const wA = bA.getAngularVelocity(), wB = bB.getAngularVelocity();
      const IcA = bA.getInertia() - mA * Vec2.dot(bA.getLocalCenter(), bA.getLocalCenter());
      const IcB = bB.getInertia() - mB * Vec2.dot(bB.getLocalCenter(), bB.getLocalCenter());
      const vCom = Vec2((vA.x * mA + vB.x * mB) / M, (vA.y * mA + vB.y * mB) / M);
      // 角動量：只取各自的自旋（合併是瞬移，軌道角動量沒有意義，保留會造成爆衝的旋轉）
      const L = IcA * wA + IcB * wB;
      const thA = bA.getAngle(), thB = bB.getAngle();
      const th = Math.atan2(mA * Math.sin(thA) + mB * Math.sin(thB), mA * Math.cos(thA) + mB * Math.cos(thB));

      // 記錄舊姿態（補間用）
      const fromPose = {};
      for (const g of [gA, gB]) for (const m of g.members) {
        const p = worldPointOfMember(g, m); fromPose[m] = { x: p[0], y: p[1], a: g.body.getAngle() };
      }
      const members = gA.members.concat(gB.members);
      const landed = gA.landed || gB.landed;
      const posGuess = [com.x / S, com.y / S];
      const ng = makeGroup(members, posGuess, th, { landed });
      // 讓實際質心對到目標質心
      let c2 = ng.body.getWorldCenter();
      let pos = ng.body.getPosition();
      ng.body.setTransform(Vec2(pos.x + com.x - c2.x, pos.y + com.y - c2.y), th);

      // 容器放不下就找最近的可放角度（繞質心轉）：寬度要放得進去，且高度不超過淘汰線；兩者都不行才只顧寬度
      const wMax = P.containerW - 6, hMax = P.deadlineH - 6;
      const rotateAboutCom = (ang) => {
        const c = ng.body.getWorldCenter(), p = ng.body.getPosition(), d = ang - ng.body.getAngle();
        const rx = p.x - c.x, ry = p.y - c.y, cs = Math.cos(d), sn = Math.sin(d);
        ng.body.setTransform(Vec2(c.x + rx * cs - ry * sn, c.y + rx * sn + ry * cs), ang);
      };
      let bb = groupAABB(ng);
      const fitsFull = (b) => b[2] - b[0] <= wMax && b[3] - b[1] <= hMax;
      const fitsW = (b) => b[2] - b[0] <= wMax;
      if (!fitsFull(bb)) {
        let found = false;
        for (const test of [fitsFull, fitsW]) {
          for (let k = 1; k <= 180 && !found; k++) {
            for (const sgn of [1, -1]) {
              rotateAboutCom(th + sgn * k * Math.PI / 180);
              bb = groupAABB(ng);
              if (test(bb)) { found = true; break; }
            }
          }
          if (found) break;
        }
        if (!found) { rotateAboutCom(th); bb = groupAABB(ng); }
      }
      // 水平方向只做「進入容器」的平移；其餘一律垂直處理
      let dx = 0;
      if (bb[0] < 3) dx = 3 - bb[0]; else if (bb[2] > P.containerW - 3) dx = P.containerW - 3 - bb[2];
      if (dx) { const p = ng.body.getPosition(); ng.body.setTransform(Vec2(p.x + dx * S, p.y), ng.body.getAngle()); }

      // 被轉了很大角度的舊區塊：它成員的舊接觸關係不再代表新的上下，不採用
      const skip = new Set(), fin = ng.body.getAngle(), lim = P.relMaxRot * Math.PI / 180;
      if (Math.abs(wrapPi(fin - thA)) > lim) for (const m of gA.members) skip.add(m);
      if (Math.abs(wrapPi(fin - thB)) > lim) for (const m of gB.members) skip.add(m);
      // 測試用：合併前「新區塊成員與其他區塊」的有效接觸上下關係，上推後檢查有沒有上下對調
      const pre = P.debugSwap ? [...groups.values()].filter((g) => g !== gA && g !== gB && g !== ng).map((g) => [g, groupRel(ng, g, null)]).filter(([, r]) => r && !Number.isNaN(r)) : null;
      // 移除舊剛體後做垂直上推
      world.destroyBody(bA); world.destroyBody(bB);
      groups.delete(gA.id); groups.delete(gB.id);
      const lift = liftAfterMerge(ng, skip);
      let swaps;
      if (pre) { swaps = 0; for (const [g, r] of pre) if (groups.has(g.id) && Math.sign(r) * verticalOrder(ng, g) < 0) swaps++; }

      // 速度：質心動量與角動量守恆
      const Inew = ng.body.getInertia() - ng.body.getMass() * Vec2.dot(ng.body.getLocalCenter(), ng.body.getLocalCenter());
      let wNew = Inew > 1e-9 ? L / Inew : 0;
      wNew = Math.max(-8, Math.min(8, wNew));
      ng.body.setLinearVelocity(Vec2(vCom.x, vCom.y - P.mergeKick));
      ng.body.setAngularVelocity(wNew + (st.rng ? (st.rng() - 0.5) : Math.random() - 0.5) * 2 * P.mergeSpin);
      ng.body.setAwake(true);

      for (const m of members) tweens[m] = { x: fromPose[m].x, y: fromPose[m].y, a: fromPose[m].a, t: 0 };
      st.merges++;
      if (penghuIdx >= 0 && (cA === penghuIdx || cB === penghuIdx)) st.links.push([penghuIdx, cA === penghuIdx ? cB : cA]);
      const cc = ng.body.getWorldCenter();
      events.push({ type: "merge", a: cA, b: cB, size: members.length, gid: ng.id, pos: [cc.x / S, cc.y / S], lift: lift.lift, maxd: lift.maxd, carried: lift.carried.length, cycle: lift.cycle, rel: lift.rel, retried: lift.retried, skipped: skip.size, swaps, pen: P.debugPen ? maxPenetration() : undefined, penPairs: P.debugPen ? penPairs(3) : undefined });
      if (members.length === N && st.status === "playing") {
        st.status = "won"; st.wonAt = st.time;
        events.push({ type: "win", time: st.time });
      }
      return ng;
    }

    function scanContacts() {
      const pairs = [], now = simSteps * P.dt;
      for (const g of groups.values()) g._touch = false;
      for (let c = world.getContactList(); c; c = c.getNext()) {
        if (!c.isTouching()) continue;
        const fa = c.getFixtureA(), fb = c.getFixtureB();
        const a = fa.getUserData(), b = fb.getUserData();
        const ga = groups.get(fa.getBody().getUserData()), gb = groups.get(fb.getBody().getUserData());
        if (ga) ga.landed = true;
        if (gb) gb.landed = true;
        if (a >= 0 && b >= 0 && ga && gb && ga !== gb) recordRel(c, a, b, now);
        const looseOk = P.looseAdj && a >= 0 && b >= 0 && ga && gb && ga !== gb && ga.members.some((x) => gb.members.some((y) => adj[x][y]));   // 實驗：區塊內任一成員與對方任一成員鄰接就算（預設關閉）
        if (a >= 0 && b >= 0 && (adj[a][b] || looseOk) && ga && gb && ga !== gb) {

    }

    function processMergesAll() {
      const pairs = scanContacts();

        if (Math.abs(w) > 12) g.body.setAngularVelocity(Math.sign(w) * 12);

    }

    function stepOnce() {
      const dt = P.dt;
      world.step(dt, P.velIter, P.posIter);
      simSteps++;
      clampSpeeds();
      if (st.status === "playing" || st.status === "won") processMergesAll();
      if (st.status !== "playing") return;
      st.time += dt;
      st.stamina = Math.min(P.shakeMax, st.stamina + P.shakeRegen * dt);
      if (st.shakeCd > 0) st.shakeCd -= dt;
      if (st.held == null && st.queue.length) {
        st.cooldown -= dt;

      }

    }

    function checkDeadline(dt) {
      let over = false, maxSp = 0;
      const dl = deadlineY();
      for (const g of groups.values()) {
        const v = g.body.getLinearVelocity(); maxSp = Math.max(maxSp, Math.hypot(v.x, v.y) / S);
        if (!g.landed) continue;
        const bb = groupAABB(g);
        if (bb[1] < dl) { over = true; }
      }
      st.over = over;
      if (over) st.grace += dt; else st.grace = Math.max(0, st.grace - dt * 2);
      if (st.grace >= P.graceSec) {
        st.status = "lost"; events.push({ type: "lose" });
      }
      // 卡關偵測：全部放下、靜止
      if (st.dropped >= N && maxSp < 6) st.stillT += dt; else { st.stillT = 0; st.stuck = false; }
      if (!st.stuck && st.stillT > P.stuckSec) { st.stuck = true; events.push({ type: "stuck" }); }
    }

    function update(realDt) {
      if (!world) return;
      realDt = Math.min(realDt, 0.1);
      acc += realDt;
      let n = 0;
      while (acc >= P.dt && n < 24) { stepOnce(); acc -= P.dt; n++; }
      if (n >= 24) acc = 0;
      if (st.status === "playing" && st.held != null) st.heldAngle = wrapPi(st.heldAngle + P.rotateDegPerSec * Math.PI / 180 * realDt);
      for (let m = 0; m < N; m++) {
        const t = tweens[m];
        if (t) { t.t += realDt; if (t.t >= P.tweenSec) tweens[m] = null; }
      }
    }

    // ---------------------------------------------------------- 拍打
    function canShake() { return st.status === "playing" && st.stamina >= P.shakeMin && st.shakeCd <= 0 && groups.size > 0; }
    function nextShakeDir() { return st.shakes % 2 === 0 ? -1 : 1; }   // 交替模式：第 1、3、5… 次向左，第 2、4、6… 次向右
    function shake(dir) {

      const d = P.shakeAlt ? nextShakeDir() : (dir < 0 ? -1 : 1);
      st.stamina -= P.shakeCost; st.shakeCd = P.shakeCooldown; st.shakes++;
      const rnd = st.rng || Math.random;
      for (const g of groups.values()) {
        const b = g.body, m = b.getMass();
        const dvx = d * P.shakeSide * (0.85 + rnd() * 0.3), dvy = P.shakeVy * (0.5 + rnd() * 0.5);
        b.applyLinearImpulse(Vec2(m * dvx, -m * dvy), b.getWorldCenter(), true);
        b.setAngularVelocity(b.getAngularVelocity() + (rnd() * 2 - 1) * P.shakeSpin);
        b.setAwake(true);
      }
      events.push({ type: "shake", dir: d });
      return true;
    }

    // ---------------------------------------------------------- 讀取給畫面
    function countyPose(m) {
      const g = groups.get(groupOf[m]);
      if (!g) return null;
      const p = worldPointOfMember(g, m);
      const cur = { x: p[0], y: p[1], a: g.body.getAngle() };
      const t = tweens[m];
      if (!t) return cur;
      const k = Math.min(1, t.t / P.tweenSec), e = 1 - Math.pow(1 - k, 3);
      return { x: t.x + (cur.x - t.x) * e, y: t.y + (cur.y - t.y) * e, a: t.a + wrapPi(cur.a - t.a) * e };
    }
    function groupsInfo() {
      const out = [];

    }
    function drainEvents() { const e = events; events = []; return e; }

    // ---------------------------------------------------------- 存檔
    const SAVE_VERSION = 4;
    function serialize() {
      const gs = [];

        const p = g.body.getPosition(), v = g.body.getLinearVelocity();
        gs.push({ members: g.members, x: p.x / S, y: p.y / S, a: g.body.getAngle(), vx: v.x, vy: v.y, w: g.body.getAngularVelocity(), landed: g.landed });
      }
      return {
        v: SAVE_VERSION, params: { containerW: P.containerW, deadlineH: P.deadlineH, headroom: P.headroom, S: P.S },
        seed: st.seed, order: st.order, queue: st.queue, slot: st.slot, previewWait: Math.max(0, st.previewAt - st.time), shakeAlt: !!P.shakeAlt, dropped: st.dropped, held: st.held, heldX: st.heldX, heldAngle: st.heldAngle,
        status: st.status, time: st.time, stamina: st.stamina, grace: st.grace, shakes: st.shakes, merges: st.merges,
        cooldown: st.cooldown, wonAt: st.wonAt, groups: gs,

    }

      if (!Array.isArray(sv.groups) || !Array.isArray(sv.queue) || sv.order.length !== N) return false;
      {
        const all = [];
        for (const g of sv.groups) for (const m of g.members) all.push(m);
        if (sv.held != null) all.push(sv.held);
        for (const m of sv.queue) all.push(m);
        if (sv.slot != null) all.push(sv.slot);
        if (all.length !== N || new Set(all).size !== N) return false;
      }
      reset(sv.seed);
      st.rng = mulberry32((st.seed ^ 0x9E3779B9) >>> 0);
      P.shakeAlt = !!sv.shakeAlt;
      st.queue = sv.queue.slice(); st.slot = sv.slot == null ? null : sv.slot;
      st.previewAt = (sv.time || 0) + (sv.previewWait || 0);
      st.order = sv.order; st.dropped = sv.dropped; st.held = sv.held; st.heldX = sv.heldX; st.heldAngle = sv.heldAngle;
      st.status = sv.status; st.time = sv.time; st.stamina = sv.stamina; st.grace = sv.grace; st.shakes = sv.shakes || 0;
      st.merges = sv.merges || 0; st.cooldown = sv.cooldown; st.wonAt = sv.wonAt; st.links = (sv.links || []).map((l) => l.slice());
      const seen = new Set();
      for (const g of sv.groups) {
        for (const m of g.members) { if (seen.has(m) || m < 0 || m >= N) return false; seen.add(m); }
        const ng = makeGroup(g.members, [g.x, g.y], g.a, { landed: !!g.landed });
        ng.body.setLinearVelocity(Vec2(g.vx, g.vy)); ng.body.setAngularVelocity(g.w);
      }
      return true;
    }

    // ---------------------------------------------------------- 對外
    function newGame(seed) {
      reset(seed == null ? (Math.random() * 4294967296) >>> 0 : seed);
      st.rng = mulberry32((st.seed ^ 0x9E3779B9) >>> 0);
      spawnHeld();
    }
    function setParams(p) { Object.assign(P, p); }

    const api = {
      N, pieces, adj, idxByName, P, penghuIdx,
      newGame, restore, serialize, update, stepOnce, drop, shake, canShake,
      setHeldX, heldPose, nextPreview, unplaced, dropPreview, previewVisible, fallTime, hold, retrieve, canHold, canRetrieve, nextShakeDir, maxPenetration, penPairs, deepIn, countyPose, groupsInfo, drainEvents, setParams,
      groupAABB: (gid) => groupAABB(groups.get(gid)),
      relation: (a, b) => ({ s: relS[a * N + b], age: simSteps * P.dt - relT[a * N + b] }),
      get relStats() { return relStats; },
      debugMerge: (a, b) => { const ga = groups.get(groupOf[a]), gb = groups.get(groupOf[b]); if (ga && gb && ga !== gb) { mergeGroups(ga, gb, a, b); return true; } return false; },
      floorY, deadlineY,
      get state() { return st; },
      get groupOf() { return groupOf; },
      get world() { return world; },
    };
    return api;
  }

  return { create, DEFAULTS, mulberry32 };
});

  // ------------------------------------------------------------ 路徑快取（相對 home 的區域座標）

    if (p.display.parts) { for (const part of p.display.parts) { ring(part.outer); for (const h of part.holes) ring(h); } }   // 澎湖：本島（C 字環＋陸地）與兩個小島
    else { ring(p.display.outer); for (const h of p.display.holes) ring(h); }

  // ------------------------------------------------------------ 畫布與縮放

  const nextCv = $("next"), nctx = nextCv.getContext("2d");

  const view = { cssW: 300, cssH: 300, dpr: 1, scale: 1, ox: 0, oy: 0 };
  function resize() {

    view.cssW = Math.max(100, r.width); view.cssH = Math.max(100, r.height);

  }
  const PAD_TOP = 34, PAD_BOT = 30, WALL = 14;   // css px；上方留給手上拼圖的市名，下方留給已落下的市名
  function layoutView() {

    const P = core.P;
    const worldW = P.containerW + 32, worldH = core.floorY() + WALL;
    view.scale = Math.min(view.cssW / worldW, Math.max(50, view.cssH - PAD_TOP - PAD_BOT) / worldH);
    view.ox = (view.cssW - P.containerW * view.scale) / 2;
    view.oy = PAD_TOP + Math.max(0, (view.cssH - PAD_TOP - PAD_BOT - worldH * view.scale) / 2);
  }

  // ------------------------------------------------------------ 遊戲建立與存檔
  function makeCore() {

    layoutView();
  }
  function startNew(seed) {

    hideOverlay("ovEnd"); lastSlotKey = "x"; lastNextKey = ""; slotHint = false; setMsg("拼圖會自己轉；滑動選位置，點一下用當下的角度放下。");
  }

    store.set(SAVE_KEY, s);
  }
  function loadOrNew() {
    makeCore();
    const sv = store.get(SAVE_KEY);

    try { ok = sv && core.restore(sv); } catch (e) { ok = false; }

  // ------------------------------------------------------------ 訊息與浮層
  let msgTimer = 0, lastSlotKey = "x", slotHint = false;
  function setMsg(t) { $("msg").textContent = t; }
  function showOverlay(id) { $(id).hidden = false; }
  function hideOverlay(id) { $(id).hidden = true; }
  const fmtTime = (t) => Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0");
  // 結果圖的區塊色：先用和縣市三色（綠 #66c2a5、橘 #fc8d62、藍紫 #8da0cb）不同色系的 ColorBrewer 色，
  // 不夠再退回縣市三色；地理上相鄰的區塊盡量不同色
  const GROUP_PALETTE = ["#e78ac3", "#ffd92f", "#a6d854", "#e5c494", "#bc80bd", "#80b1d3", "#fdb462", "#66c2a5", "#fc8d62", "#8da0cb"];
  function groupColors(ordered) {
    const out = [], cnt = {};
    ordered.forEach((g, i) => {
      const nb = new Set();
      for (let j = 0; j < i; j++) if (g.members.some((a) => ordered[j].members.some((b) => core.adj[a][b]))) nb.add(out[j]);

      let c = GROUP_PALETTE.find((x) => !cnt[x]);

      if (c == null) c = GROUP_PALETTE.slice().sort((x, y) => cnt[x] - cnt[y])[0];

  }

    }

  // ------------------------------------------------------------ 輸入
  const keys = { left: false, right: false };

  let pressed = false, pressType = "mouse", cancelZone = false;

  // 觸控（與手寫筆）：拖到淘汰線以上放開＝取消，不放下；滑鼠沒有這個動作，點哪裡都照常放下

  }
  const anyOverlayOpen = () => ["ovEnd", "ovConfirm", "ovSettings"].some((id) => !$(id).hidden);

  window.addEventListener("keydown", (e) => {

    const pts = []; for (const part of pp.display.parts) for (const q of part.outer) pts.push(q);
    let best = null;
    for (const b of cp.borders) {
      if (b.with !== "sea") continue;

  // 下方三市文字的左右策略（items 需有 ax、w）：
  //   三組：最左者先試靠左、最右者先試靠右（放不下才換邊），中間者先試左右兩側中空間較大的一邊
  //   兩組：同上但沒有中間者；一組：在中線以左先試靠左，以右先試靠右
  //   放不下（超出邊界或與已放的文字重疊）就換邊，兩邊都不行再往下一列
  function layoutGuideLabels(items, minX, maxX, cx, stub, tgap, gap) {
    const order = items.slice().sort((a, b) => a.ax - b.ax), n = order.length, rows = [];
    const span = (it, side) => { const x0 = it.ax + side * (stub + tgap), x1 = x0 + side * it.w; return { x0, l: Math.min(it.ax, x0, x1), r: Math.max(it.ax, x0, x1) }; };

  // 市（基隆市、新竹市、嘉義市）：導引線標示。手上的在上方，已落下的在下方，左右順序同拼圖塊。
  function drawGuides(hp, st) {
    const px = 1 / view.scale, W = core.P.containerW, F = core.floorY();
    const fs = 13 * px, gap = 12 * px;
    ctx.save(); ctx.font = `700 ${fs}px ${theme.font}`; ctx.lineJoin = "round"; ctx.lineCap = "round";
    const placed = [], held = [];
    for (const m of guideIdx) {
      const isHeld = hp && hp.county === m && st.status === "playing";
      const pose = isHeld ? { x: hp.x, y: hp.y, a: hp.a } : core.countyPose(m);
      if (!pose) continue;
      const lab = shapes.pieces[m].label, c = Math.cos(pose.a), s = Math.sin(pose.a);
      const it = { m, ax: pose.x + c * lab.x - s * lab.y, ay: pose.y + s * lab.x + c * lab.y, w: ctx.measureText(shapes.pieces[m].name).width };

    const minX = (6 - view.ox) * px, maxX = (view.cssW - view.ox - 6) * px;
    const lineStyle = () => { ctx.strokeStyle = theme.guide; ctx.fillStyle = theme.guide; ctx.lineWidth = 2 * px; ctx.setLineDash([]); };
    // 下方（已落下）：標線成 L 型——從拼圖垂直拉到容器底正下方，轉成一小段橫線，文字貼著橫線端點放在左側或右側
    const stub = 14 * px, tgap = 4 * px, rowH = fs + 6 * px;
    const yRow0 = F + WALL + 3 * px + fs / 2;
    layoutGuideLabels(placed, minX, maxX, W / 2, stub, tgap, gap);
    for (const it of placed) {
      const yy = yRow0 + it.row * rowH;
      lineStyle(); ctx.beginPath(); ctx.moveTo(it.ax, it.ay); ctx.lineTo(it.ax, yy); ctx.lineTo(it.ax + it.side * stub, yy); ctx.stroke();
      ctx.beginPath(); ctx.arc(it.ax, it.ay, 2.5 * px, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = theme["guide-text"]; ctx.textAlign = it.side > 0 ? "left" : "right"; ctx.textBaseline = "middle";
      ctx.fillText(shapes.pieces[it.m].name, it.tx, yy);
    }
    // 上方（手上、尚未落下）
    for (const it of held) {
      const top = hp.y + hp.bbox[1];
      const rowUp = Math.max(top - 14 * px, -view.oy * px + fs + 10 * px);
      const slot = Math.max(minX + it.w / 2, Math.min(maxX - it.w / 2, it.ax));
      lineStyle(); ctx.beginPath(); ctx.moveTo(it.ax, it.ay); ctx.lineTo(it.ax, rowUp); ctx.lineTo(slot, rowUp); ctx.stroke();
      ctx.beginPath(); ctx.arc(it.ax, it.ay, 2.5 * px, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = theme["guide-text"]; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.fillText(shapes.pieces[it.m].name, slot, rowUp - 4 * px);
    }
    ctx.restore();
  }

  let hatchCache = { color: "", pat: null };
  function hatchPattern() {   // 45° 斜線，螢幕上線距約 7px；顏色隨主題
    if (hatchCache.color === theme.ghost && hatchCache.pat) return hatchCache.pat;
    const T = 10, c = document.createElement("canvas"); c.width = c.height = T;
    const g = c.getContext("2d"); g.strokeStyle = theme.ghost; g.lineWidth = 1.7;
    g.beginPath();
    g.moveTo(0, T); g.lineTo(T, 0); g.moveTo(-T / 2, T / 2); g.lineTo(T / 2, -T / 2); g.moveTo(T / 2, T * 1.5); g.lineTo(T * 1.5, T / 2);
    g.stroke();
    hatchCache = { color: theme.ghost, pat: ctx.createPattern(c, "repeat") };
    return hatchCache.pat;
  }
  function draw(ts) {
    const P = core.P, st = core.state, W = P.containerW, F = core.floorY(), DL = core.deadlineY(), px = 1 / view.scale;
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.clearRect(0, 0, view.cssW, view.cssH);
    ctx.save();
    let jx = 0, jy = 0;
    if (shakeAmp > 0.01) { jx = (Math.random() - 0.5) * 10 * shakeAmp; jy = (Math.random() - 0.5) * 10 * shakeAmp; }
    ctx.translate(view.ox + jx, view.oy + jy); ctx.scale(view.scale, view.scale);

    // 容器
    const top = -view.oy * px;
    ctx.fillStyle = theme["cv-drop"]; ctx.fillRect(0, top, W, DL - top);
    const grd = ctx.createLinearGradient(0, DL, 0, F); grd.addColorStop(0, theme["cv-water"]); grd.addColorStop(1, theme["cv-water-deep"]);
    ctx.fillStyle = grd; ctx.fillRect(0, DL, W, F - DL);
    ctx.fillStyle = theme["cv-wall"];
    ctx.fillRect(-WALL, top, WALL, F + WALL - top); ctx.fillRect(W, top, WALL, F + WALL - top); ctx.fillRect(-WALL, F, W + WALL * 2, WALL);

    // 淘汰線
    const warn = st.over ? 0.5 + 0.5 * Math.sin(ts / 90) : 0;
    ctx.save();
    ctx.setLineDash([14, 10]); ctx.lineWidth = 2.5 + warn * 2; ctx.strokeStyle = theme["cv-danger"]; ctx.globalAlpha = 0.65 + warn * 0.35;
    ctx.beginPath(); ctx.moveTo(0, DL); ctx.lineTo(W, DL); ctx.stroke();
    ctx.restore();
    ctx.font = `500 ${13 * px}px ${theme.font}`; ctx.fillStyle = theme["cv-danger"]; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText(st.over ? `超過淘汰線 ${Math.max(0, P.graceSec - st.grace).toFixed(1)}s` : "淘汰線", 8, DL - 5 * px);

    // 手上的拼圖：繞旋轉中心順時針自轉（中心點不顯示）；超出容器上緣的部分不顯示
    const hp = core.heldPose();
    const holding = hp && st.status === "playing";
    const pv = holding && core.previewVisible() ? core.dropPreview() : null;   // 剛放下的拼圖還在掉時不顯示預覽
    if (holding) {
      ctx.save();
      ctx.beginPath(); ctx.rect(-WALL, 0, W + WALL * 2, F); ctx.clip();
      if (pv) {
        // 落點線：從旋轉中心往下到虛影的旋轉中心
        ctx.save();
        ctx.setLineDash([3 * px * 2, 9 * px]); ctx.lineWidth = Math.max(2, 1.5 * px); ctx.strokeStyle = theme["cv-wall"]; ctx.globalAlpha = cancelZone ? 0.2 : 0.75;
        ctx.beginPath(); ctx.moveTo(hp.px, hp.py); ctx.lineTo(hp.px, hp.py + pv.dy); ctx.stroke();
        ctx.restore();
        // 第一次接觸時的虛影：灰色斜線 + 灰色虛線外框，不用縣市色
        ctx.save(); ctx.globalAlpha = cancelZone ? 0.3 : 1;
        ctx.translate(pv.x, pv.y); ctx.rotate(pv.a);
        ctx.fillStyle = theme.ghost; ctx.globalAlpha *= 0.13; ctx.fill(fillPaths[pv.county], "evenodd"); ctx.globalAlpha = cancelZone ? 0.3 : 1;
        ctx.save(); ctx.clip(fillPaths[pv.county], "evenodd");
        ctx.rotate(-pv.a); ctx.translate(-pv.x, -pv.y);                    // 斜線方向固定，不跟著拼圖轉
        const pat = hatchPattern(); if (pat) { pat.setTransform(new DOMMatrix().scale(px)); ctx.fillStyle = pat; ctx.fillRect(pv.x - 700, pv.y - 700, 1400, 1400); }
        ctx.restore();
        ctx.setLineDash([8 * px, 6 * px]); ctx.lineWidth = Math.max(2.5, 1.6 * px); ctx.lineJoin = "round"; ctx.strokeStyle = theme.ghost;
        for (const b of borderPaths[pv.county]) ctx.stroke(b.path);
        ctx.restore();
      }
      const hpose = () => ({ x: hp.x, y: hp.y, a: hp.a });
      drawGroupShape([hp.county], hpose, cancelZone ? 0.35 : 1);
      ctx.restore();
    }

    // 已落下的拼圖：先畫所有區塊，再畫文字，文字不會被別的拼圖蓋住
    const gi = core.groupsInfo();
    for (const g of gi) drawGroupShape(g.members, (m) => core.countyPose(m), 1);
    drawLinks((m) => core.countyPose(m), px);

    // 鄰接提示
    if (holding && $("chkHint").checked) {
      ctx.save(); ctx.strokeStyle = theme.hint; ctx.lineWidth = Math.max(5, 3 * px); ctx.lineJoin = "round";
      for (const g of gi) for (const m of g.members) if (core.adj[hp.county][m]) {
        const p = core.countyPose(m); if (!p) continue;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.stroke(fillPaths[m]); ctx.restore();
      }
      ctx.restore();
    }
    if (holding) { ctx.save(); ctx.beginPath(); ctx.rect(-WALL, 0, W + WALL * 2, F); ctx.clip(); drawLabel(hp.county, { x: hp.x, y: hp.y, a: hp.a }, cancelZone ? 0.35 : 1); ctx.restore(); }
    for (const g of gi) for (const m of g.members) { const p = core.countyPose(m); if (p) drawLabel(m, p, 1); }
    drawGuides(hp, st);

    // 合併特效
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i], k = (ts - r.t0) / 450;
      if (k >= 1) { rings.splice(i, 1); continue; }
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.lineWidth = 4 * (1 - k) + 1; ctx.strokeStyle = theme.hint;
      ctx.beginPath(); ctx.arc(r.x, r.y, 20 + k * (60 + r.size * 14), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }

    // 觸控取消提示
    if (pressed && pressType !== "mouse" && st.status === "playing") {
      ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
      if (cancelZone) {
        ctx.font = `700 ${22 * px}px ${theme.font}`; ctx.fillStyle = theme["cv-danger"];
        ctx.fillText("放開＝取消", W / 2, Math.max(top + 30 * px, DL / 2));
      } else {
        ctx.font = `500 ${12 * px}px ${theme.font}`; ctx.fillStyle = theme["cv-danger"]; ctx.globalAlpha = 0.9;
        ctx.fillText("↑ 拖到紅線以上放開＝取消", W / 2, DL + 18 * px);
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawPieceIn(cv, c2, m) {
    c2.setTransform(1, 0, 0, 1, 0, 0); c2.clearRect(0, 0, cv.width, cv.height);
    if (m == null) return;
    const bb = shapes.pieces[m].bboxLocal, w = bb[2] - bb[0], h = bb[3] - bb[1];
    const s = Math.min((cv.width - 20) / w, (cv.height - 20) / h);
    c2.translate(cv.width / 2 - (bb[0] + w / 2) * s, cv.height / 2 - (bb[1] + h / 2) * s); c2.scale(s, s);
    c2.fillStyle = fillFor(m); c2.fill(fillPaths[m], "evenodd");
    c2.strokeStyle = theme["edge-out"]; c2.lineJoin = "round";
    c2.save(); c2.clip(outsidePaths[m], "evenodd"); c2.lineWidth = 2 * 2 / s * (m === PENGHU_I ? PENGHU_K : 1);
    for (const b of borderPaths[m]) c2.stroke(b.path);
    c2.restore();
  }
  function drawNext() {
    const m = core.nextPreview();
    $("nextName").textContent = m == null ? (core.state.held == null ? "—" : "最後一塊") : shapes.pieces[m].name;
    drawPieceIn(nextCv, nctx, m);
  }
  function drawSlot() {
    const m = core.state.slot;
    $("slotName").textContent = m == null ? "空" : shapes.pieces[m].name;
    drawPieceIn(slotCv, sctx, m);
  }

  // ------------------------------------------------------------ 主迴圈
  let last = 0, lastNextKey = "", hudT = 0;
  function frame(ts) {
    const dt = last ? (ts - last) / 1000 : 0; last = ts;
    if (core) {
      const st = core.state;
      if (st.status === "playing") {
        const sp = 650 * dt;
        const h0 = core.heldPose();
        if (h0 && keys.left) core.setHeldX(h0.px - sp);
        if (h0 && keys.right) core.setHeldX(h0.px + sp);
      }
      const was = st.status;
      core.update(dt);
      for (const e of core.drainEvents()) {
        if (e.type === "merge") {
          rings.push({ x: e.pos[0], y: e.pos[1], t0: ts, size: e.size });
          setMsg(`${core.pieces[e.a].name} 與 ${core.pieces[e.b].name} 合併（${e.size} 縣市）。`);
        } else if (e.type === "shake") {
          setMsg(e.dir < 0 ? "向左拍打。" : "向右拍打。");
        } else if (e.type === "stuck" && !stuckShown) {
          stuckShown = true; setMsg("全部放下後沒有動靜了，試著拍打機台讓區塊互相接觸。");
        }
      }
      if (was === "playing" && st.status !== "playing") { saveNow(); showEnd(); }
      shakeAmp *= Math.pow(0.002, dt);

      draw(ts);
      hudT += dt;
      const nk = String(st.dropped) + ":" + st.held + ":" + st.queue.length + ":" + st.queue[0];
      if (nk !== lastNextKey) { lastNextKey = nk; drawNext(); }
      const sk = String(st.slot);
      if (sk !== lastSlotKey) { lastSlotKey = sk; drawSlot(); }
      if (hudT > 0.1) {
        hudT = 0;
        $("sDropped").textContent = `${st.dropped}/${Nn()}`;
        $("sGroups").textContent = String(core.groupsInfo().length);
        $("sTime").textContent = fmtTime(st.status === "won" ? st.wonAt : st.time);
        const pct = Math.max(0, Math.min(100, (st.stamina / core.P.shakeMax) * 100));
        $("stam").style.width = pct + "%";
        $("stamBar").classList.toggle("low", st.stamina < core.P.shakeMin);
        $("stamBar").setAttribute("aria-valuenow", String(Math.round(pct)));
        const cs = core.canShake(), alt = !!core.P.shakeAlt;
        $("shakeSel").hidden = alt; $("shakeAlt").hidden = !alt;
        $("btnShakeL").disabled = !cs; $("btnShakeR").disabled = !cs; $("btnShakeA").disabled = !cs;
        // 交替模式：只有一顆鈕，箭頭在當下要拍的方向那一側，另一側補全形空白讓文字維持置中
        const nd = core.nextShakeDir();
        $("altL").textContent = nd < 0 ? "◀ " : "　"; $("altR").textContent = nd < 0 ? "　" : " ▶";
        $("btnShakeA").setAttribute("aria-label", nd < 0 ? "拍打（向左）" : "拍打（向右）");
        // 保留區：同一顆鈕，保留區空的時候是「保留」，有拼圖的時候是「取出」
        const ret = core.canRetrieve();
        $("holdLabel").textContent = ret ? "取出" : "保留";
        $("btnHold").disabled = !(ret || core.canHold());
        if (st.status === "playing" && st.held == null && !st.queue.length && st.slot != null && !slotHint) { slotHint = true; setMsg("拼圖都放完了，保留區還有一塊，按「取出」。"); }
        $("sDropped").textContent = `${st.dropped}/${Nn()}`;
        if (document.activeElement !== $("selMode")) $("selMode").value = alt ? "1" : "0";
      }
    }
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------ 啟動
  function boot() {
    loadOrNew(); syncModeUi(); resize(); drawNext(); drawSlot(); requestAnimationFrame(frame);
    window.__tp = { get core() { return core; }, startNew, resize, layoutGuideLabels };   // 供偵錯與自動測試
  }
  const fontsReady = document.fonts && document.fonts.load ? document.fonts.load("500 14px 'Noto Sans TC'", "台灣拼圖").catch(() => {}) : Promise.resolve();
  Promise.race([fontsReady, new Promise((r) => setTimeout(r, 1200))]).then(boot);
})();

</script>
